# tandemkb.com on Cloudflare: the built site in dist/, served by the Worker in
# worker/index.ts. Deploy with `npm run build && npx wrangler deploy`.
# `npm run site` runs the same thing locally on http://127.0.0.1:8787, with
# the OAuth app's ID and secret from .dev.vars.

name = "tandem"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
send_metrics = false

# tandemkb.com is a zone on the same Cloudflare account. Deploying attaches it
# to this Worker, DNS record and certificate included. `wrangler dev` ignores it.
routes = [{ pattern = "tandemkb.com", custom_domain = true }]

[assets]
directory = "./dist"
binding = "ASSETS"
# Paths like /auth/callback load the app, which routes them itself.
not_found_handling = "single-page-application"
# Every request goes through the Worker, so it can add security headers.
run_worker_first = true

[vars]
# The client ID of the GitHub OAuth app whose callback URL is
# https://tandemkb.com/auth/callback. Its secret is set separately with
# `npx wrangler secret put GITHUB_CLIENT_SECRET`.
GITHUB_CLIENT_ID = ""
